name: Validate specification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate policies and schemas
        run: python tools/validate.py --include-valid-fixtures
      - name: Run governance tests
        run: python -m unittest discover -s tests -v
      - name: Exercise standard-library schema fallback
        run: python -S tools/validate.py schemas/*.json
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
