kind: lifecycle
states: [SIGNAL, DISCOVERED, EVIDENCED, VALIDATION_READY, VALIDATING, APPROVED]
initial: SIGNAL
final: APPROVED
transitions:
  SIGNAL: [DISCOVERED]
  DISCOVERED: [EVIDENCED]
  EVIDENCED: [VALIDATION_READY]
  VALIDATION_READY: [VALIDATING]
  VALIDATING: [APPROVED]
  APPROVED: []
events:
  - {from: SIGNAL, to: DISCOVERED}
  - {from: DISCOVERED, to: EVIDENCED}
  - {from: EVIDENCED, to: VALIDATION_READY}
  - {from: VALIDATION_READY, to: VALIDATING}
  - {from: VALIDATING, to: APPROVED}
